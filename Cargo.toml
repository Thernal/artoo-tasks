# Task management for Artoo: a tracker's boards and issues as a space — Jira, Trello, or one another plugin adds.
[package]
name = "artoo-tasks"
version = "0.1.2"
edition = "2024"
repository = "https://github.com/Thernal/artoo-tasks"

# A shared library Artoo loads. The SDK is no dependency here: `scripts/build.sh` gives it to rustc, as std is given.
[lib]
crate-type = ["dylib"]

[dependencies]
# What a tracker is, shared with the plugins that add one (`api/`).
artoo-tasks-api = { path = "api" }

[workspace]
members = ["api"]
